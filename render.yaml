services:
  - type: web
    name: orbit-creator-workspace
    runtime: docker
    branch: codex/product-launch
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    disk:
      name: orbit-data
      mountPath: /var/lib/orbit
      sizeGB: 1
    envVars:
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
